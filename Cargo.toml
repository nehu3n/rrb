[package]
name = "rrb"
description = "Rusty raid bot tool for Discord"
authors = ["Nehuén <https://github.com/nehu3n>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/nehu3n/rrb"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
cliclack = "0.3.5"
serenity = { version = "0.12.4", features = ["cache", "model"] }
tokio = { version = "1.42.0", features = ["full"] }
